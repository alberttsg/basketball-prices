---
name: Update prices

# Procesa cada día las ventas de cartas de baloncesto de TheCardAPI y publica los precios en la rama gh-pages
# (GitHub Pages), que es de donde los lee la app.

on:
  schedule:
    # Las ventas del día anterior ya están a primera hora (UTC). La segunda pasada es un reintento: si la
    # primera ya procesó los días pendientes, no descarga nada
    - cron: '0 6 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Volver a procesar los días del plan aunque ya estén cerrados'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
      THECARDAPI_KEY: ${{ secrets.THECARDAPI_KEY }}
      # Días hacia atrás que permite el plan de TheCardAPI (gratis: 3, Starter: 14). Variable del repositorio
      LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS || '3' }}
      FORCE: ${{ inputs.force && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Lo ya publicado: el script añade los días nuevos al histórico de cada carta
      - name: Get published prices
        run: |
          if git ls-remote --exit-code --heads "$REMOTE" gh-pages > /dev/null; then
            git clone --depth 1 --branch gh-pages "$REMOTE" public
          else
            mkdir public
          fi

      - name: Build prices
        id: build
        run: node build.mjs public

      # Un único commit que sustituye al anterior: el repositorio no crece con cada día
      - name: Publish
        if: steps.build.outputs.changed == 'true'
        run: |
          cd public
          rm -rf .git
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Prices $(date -u +%F)"
          git push -q --force "$REMOTE" gh-pages
